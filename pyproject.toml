[project]
name = "real-time-language-translator-with-ar-visualization"
version = "0.1.0"
description = "revamp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy", 
    "pandas==1.5.3",
    "requests>=2.28",
    "torch",
    "torchvision",
    "torchaudio",
    "pypickle>=2.0.1"
]

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-nightly" }
torchvision = { index = "pytorch-nightly" }
torchaudio = { index = "pytorch-nightly" }